# Deploy (publicação) da versão web do NoPod no GitHub Pages.
# Roda sozinho a cada push na branch main (ou manualmente na aba Actions).
# As credenciais do Firebase vêm dos "Secrets" do repositório:
# Settings > Secrets and variables > Actions.
name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar versão web
    runs-on: ubuntu-latest
    env:
      EXPO_BASE_URL: /${{ github.event.repository.name }}
      EXPO_PUBLIC_API_KEY: ${{ secrets.EXPO_PUBLIC_API_KEY }}
      EXPO_PUBLIC_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_AUTH_DOMAIN }}
      EXPO_PUBLIC_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_PROJECT_ID }}
      EXPO_PUBLIC_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_STORAGE_BUCKET }}
      EXPO_PUBLIC_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_APP_ID: ${{ secrets.EXPO_PUBLIC_APP_ID }}
      # A chave da Mistral NÃO é enviada para a versão web:
      # tudo que vai para o navegador fica visível para qualquer pessoa.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build da versão web
        run: npx expo export --platform web

      - name: Página 404 (navegação entre telas)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
